---
- name: Create a VM
  hosts: all
  
  tasks:
  - name: Create a VirtualMachine
    redhat.openshift_virtualization.kubevirt_vm:
      state: present
      name: "{{ vm_name }}"
      namespace: "{{ vm_namespace }}"
      labels:
        app: "{{ app_name }}"
      instancetype:
        name: "{{ vm_flavor }}"
      preference:
        name: "{{ vm_image }}"
      spec:
        domain:
          devices:
            interfaces:
